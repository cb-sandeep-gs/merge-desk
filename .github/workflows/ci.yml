name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS: the package targets macOS 14+ and the tests drive the real /usr/bin/git.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          git --version
          # Annotations are public (job logs need admin rights): record the toolchain there too.
          echo "::notice title=Toolchain::$(swift --version 2>&1 | head -1)"

      - name: Lint
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

      - name: Build
        run: |
          # On failure, surface the compiler errors as annotations so they're readable without log access.
          set -o pipefail
          if ! swift build 2>&1 | tee build.log; then
            grep -E "error:" build.log | head -20 | while IFS= read -r line; do echo "::error title=Build::${line}"; done
            exit 1
          fi

      - name: Test
        run: swift test --parallel

      - name: CLI smoke test
        run: |
          swift run mergedesk version
          swift run mergedesk config validate --file docs/examples/mercury-ios.mergedesk.json
          swift run mergedesk fixtures build "$RUNNER_TEMP/fixtures"
          swift run mergedesk list --repo .
          swift run mergedesk predict --repo .
          swift run mergedesk session list --repo .
          swift run mergedesk eval --repo . --since 1.month

      - name: App bundle
        run: ./Scripts/build-app.sh release
